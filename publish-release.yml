name: Publish signed update APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New integer Android versionCode (e.g. 6, 7, 8)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify version and signing secrets
        env:
          CODE: ${{ inputs.version_code }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          [[ "$CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'Version must be positive integer'; exit 1; }
          test -n "$SIGNING_KEYSTORE_BASE64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD" || { echo 'Missing signing secrets'; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roadsafety-release.jks"
          test -s "$RUNNER_TEMP/roadsafety-release.jks"
      - name: Build signed release APK
        env:
          CODE: ${{ inputs.version_code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionCodeOverride="$CODE" \
            -PreleaseStoreFile="$RUNNER_TEMP/roadsafety-release.jks" \
            -PreleaseStorePassword="$SIGNING_STORE_PASSWORD" \
            -PreleaseKeyAlias="$SIGNING_KEY_ALIAS" \
            -PreleaseKeyPassword="$SIGNING_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk RoadSafetyGPS-release.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ inputs.version_code }}
        run: |
          if gh release view "v$CODE" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to overwrite.'; exit 1
          fi
          gh release create "v$CODE" RoadSafetyGPS-release.apk --target "$GITHUB_SHA" --title "도로안심 GPS v$CODE" --notes "도로안심 GPS 안드로이드 업데이트 v$CODE" --latest
